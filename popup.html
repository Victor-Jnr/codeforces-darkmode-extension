<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            text-align: center;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #2d2d2d;
            padding: 10px;
            border-radius: 5px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background-color: #444;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .toggle-switch.active {
            background-color: #64b5f6;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }

        .toggle-switch.active::after {
            left: 28px;
        }

        .label {
            flex: 1;
            font-weight: bold;
        }

        .info {
            background-color: #2d2d2d;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
            line-height: 1.4;
        }

        .status {
            text-align: center;
            font-size: 12px;
            color: #64b5f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 Codeforces Dark Mode</h1>
        
        <div class="toggle-container">
            <div class="label">Dark Mode</div>
            <div class="toggle-switch active" id="darkModeToggle"></div>
        </div>

        <div class="info">
            Dark mode will automatically apply to Codeforces pages.<br>
            Toggle it on/off anytime using this popup.
        </div>

        <div class="status" id="status">Active ✓</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
